name: Construir APK FútbolHub + Plan Creador

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -q ./*.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Buscar proyecto Android
        run: |
          PROJECT_DIR=$(find proyecto -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró el archivo gradlew."
            echo "Contenido del directorio proyecto:"
            find proyecto -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corregir compatibilidad Java y Kotlin
        run: |
          cd "$PROJECT_DIR"

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print | while read -r file; do
            echo "Revisando: $file"

            if grep -q "compileOptions" "$file"; then
              sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_[0-9]*/sourceCompatibility = JavaVersion.VERSION_17/g' "$file"
              sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_[0-9]*/targetCompatibility = JavaVersion.VERSION_17/g' "$file"
            fi

            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*["'\''][^"'\'']*["'\'']/jvmTarget = "17"/g' "$file"
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*JavaVersion.VERSION_[0-9]*/jvmTarget = "17"/g' "$file"
          done

          echo "=== Configuración Java/Kotlin encontrada ==="
          grep -RniE "sourceCompatibility|targetCompatibility|jvmTarget" \
            --include="*.gradle" \
            --include="*.gradle.kts" . || true

      - name: Dar permisos a Gradle
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: No existe gradlew en $PROJECT_DIR"
            exit 1
          fi

          chmod +x ./gradlew

      - name: Construir APK
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Buscar APK
        run: |
          mkdir -p artifacts

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ningún APK."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" artifacts/futbolhub-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: futbolhub-apk
          path: artifacts/futbolhub-debug.apk
          if-no-files-found: error
