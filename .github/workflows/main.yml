name: Construir APK Fútbol Hub + Creator Plan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Buscar proyecto Android
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró el archivo gradlew"
            echo "El proyecto no tiene una estructura Android válida."
            exit 1
          fi
          echo "Proyecto encontrado:"
          dirname "$GRADLEW"

      - name: Construir APK
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbolHubCreatorPlan-APK
          path: |
            proyecto/**/build/outputs/apk/**/*.apk
            proyecto/**/build/outputs/apk/*.apk
