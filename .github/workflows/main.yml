name: Construir APK Fútbol Hub + Creator Plan

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buscar proyecto Android
        run: |
          SETTINGS=$(find proyecto -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle ni settings.gradle.kts"
            echo "El proyecto Android no fue encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto Android encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Construir APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Buscar APK
        run: |
          echo "APKs generados:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbolHubCreatorPlan-APK
          path: |
            proyecto/**/build/outputs/apk/**/*.apk
            proyecto/**/build/outputs/apk/*.apk
          if-no-files-found: error
