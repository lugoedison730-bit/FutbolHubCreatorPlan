name: Construir APK Fútbol Hub + Plan Creador

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir -p proyecto
          unzip -q *.zip -d proyecto

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buscar proyecto Android
        run: |
          PROJECT_DIR=$(find proyecto -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró un proyecto Android"
            exit 1
          fi

          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

        - name: Corregir compatibilidad Java y Kotlin
          run: |
            cd "$PROJECT_DIR"

          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | while IFS= read -r -d '' file; do
            echo "Revisando: $file"

            if grep -q "compileOptions" "$file"; then
              sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' "$file"
              sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' "$file"
            fi

            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*"1.8"/jvmTarget = "17"/g' "$file"
            sed -i "s/jvmTarget[[:space:]]*=[[:space:]]*'1.8'/jvmTarget = '17'/g" "$file"
          done

          echo "=== Configuración Java/Kotlin encontrada ==="
          grep -RniE "sourceCompatibility|targetCompatibility|jvmTarget" . \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Dar permisos a Gradle
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Construir APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace -Pkotlin.jvm.target.validation.mode=warning
        

      - name: Buscar APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: futbolhub-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
