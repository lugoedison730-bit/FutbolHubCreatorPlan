name: Build FutbolHub + Planifica APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE/build_workspace"

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          echo "Searching for application ZIP..."

          ZIP_FILE=""

          while IFS= read -r -d '' file; do
            case "$file" in
              "$GITHUB_WORKSPACE/build_workspace/"*)
                continue
                ;;
              "$GITHUB_WORKSPACE/.git/"*)
                continue
                ;;
            esac

            ZIP_FILE="$file"
            break
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -not -path "$GITHUB_WORKSPACE/build_workspace/*" \
              -print0
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No application ZIP file was found."
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d "$WORKSPACE"

          echo "Extracted files:"
          find "$WORKSPACE" -maxdepth 6 -type f -print | sort

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$GITHUB_WORKSPACE/build_workspace"

          PROJECT_DIR=""

          echo "Searching for Android project..."

          while IFS= read -r -d '' settings_file; do
            candidate_dir="$(dirname "$settings_file")"

            if [ -f "$candidate_dir/settings.gradle" ] || \
               [ -f "$candidate_dir/settings.gradle.kts" ]; then

              if [ -f "$candidate_dir/app/build.gradle" ] || \
                 [ -f "$candidate_dir/app/build.gradle.kts" ]; then

                PROJECT_DIR="$candidate_dir"
                break
              fi
            fi
          done < <(
            find "$WORKSPACE" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be detected."

            echo ""
            echo "All extracted files:"
            find "$WORKSPACE" -maxdepth 10 -type f -print | sort

            echo ""
            echo "Detected settings files:"
            find "$WORKSPACE" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print

            echo ""
            echo "Detected application build files:"
            find "$WORKSPACE" \
              -type f \
              \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
              -print

            exit 1
          fi

          echo "Android project detected:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inspect project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo ""
          echo "========================================"
          echo "PROJECT CONTENTS"
          echo "========================================"

          find "$PROJECT_DIR" -maxdepth 5 -type f -print | sort

          echo ""
          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          gradle --version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME"
          fi

          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          fi

          echo ""
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed || true

          echo ""
          echo "========================================"
          echo "GRADLE CONFIGURATION"
          echo "========================================"

          for file in \
            "$PROJECT_DIR/build.gradle" \
            "$PROJECT_DIR/build.gradle.kts" \
            "$PROJECT_DIR/settings.gradle" \
            "$PROJECT_DIR/settings.gradle.kts" \
            "$PROJECT_DIR/gradle.properties"
          do
            if [ -f "$file" ]; then
              echo ""
              echo "----- $file -----"
              cat "$file"
            fi
          done

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FOUND="false"
          APP_BUILD_FOUND="false"

          if [ -f "$PROJECT_DIR/settings.gradle" ] || \
             [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            SETTINGS_FOUND="true"
          fi

          if [ -f "$PROJECT_DIR/app/build.gradle" ] || \
             [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            APP_BUILD_FOUND="true"
          fi

          if [ "$SETTINGS_FOUND" != "true" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          if [ "$APP_BUILD_FOUND" != "true" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Android project validation successful."

      - name: Detect Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_COMMAND="gradle"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            GRADLE_COMMAND="$PROJECT_DIR/gradlew"
            echo "Gradle Wrapper detected."
          else
            echo "Gradle Wrapper not found."
            echo "Using Gradle installed by setup-gradle."
          fi

          echo "GRADLE_COMMAND=$GRADLE_COMMAND" >> "$GITHUB_ENV"

      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "AVAILABLE GRADLE TASKS"
          echo "========================================"

          "$GRADLE_COMMAND" tasks --all --no-daemon --stacktrace

      - name: Detect APK build task
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          TASKS="$("$GRADLE_COMMAND" tasks --all --no-daemon 2>&1)"

          BUILD_TASK=""

          if echo "$TASKS" | grep -Eq '^[[:space:]]*assembleDebug([[:space:]]|$)'; then
            BUILD_TASK="assembleDebug"
          elif echo "$TASKS" | grep -Eq '^[[:space:]]*:app:assembleDebug([[:space:]]|$)'; then
            BUILD_TASK=":app:assembleDebug"
          else
            while IFS= read -r line; do
              task="$(echo "$line" | sed 's/^[[:space:]]*//')"

              case "$task" in
                assemble*Debug)
                  BUILD_TASK="$task"
                  break
                  ;;
                *:assemble*Debug)
                  BUILD_TASK="$task"
                  break
                  ;;
              esac
            done <<< "$TASKS"
          fi

          if [ -z "$BUILD_TASK" ]; then
            echo "ERROR: No Debug APK build task could be detected."

            echo ""
            echo "Available assemble tasks:"
            echo "$TASKS" | grep -i "assemble" || true

            exit 1
          fi

          echo "Detected build task:"
          echo "$BUILD_TASK"

          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "Gradle command:"
          echo "$GRADLE_COMMAND"

          echo "Build task:"
          echo "$BUILD_TASK"

          "$GRADLE_COMMAND" "$BUILD_TASK" \
            --stacktrace \
            --info \
            --no-daemon

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs"

          echo "========================================"
          echo "SEARCHING FOR APK FILES"
          echo "========================================"

          APK_FILES=()

          while IFS= read -r -d '' apk; do
            APK_FILES+=("$apk")
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -iname "*.apk" \
              -print0
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK was generated."

            echo ""
            echo "Expected output directory:"
            echo "$APK_DIR"

            echo ""
            echo "Contents of app/build/outputs:"
            if [ -d "$APK_DIR" ]; then
              find "$APK_DIR" -maxdepth 10 -print
            else
              echo "Directory does not exist."
            fi

            echo ""
            echo "All build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs*" \
              -print || true

            echo ""
            echo "Relevant Gradle tasks:"
            "$GRADLE_COMMAND" tasks --all --no-daemon 2>&1 | \
              grep -Ei "assemble|package|apk" || true

            exit 1
          fi

          echo "APK files found:"

          : > "$GITHUB_WORKSPACE/apk-list.txt"

          for apk in "${APK_FILES[@]}"; do
            echo "$apk"
            echo "$apk" >> "$GITHUB_WORKSPACE/apk-list.txt"
          done

      - name: Show APK information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERATED APK INFORMATION"
          echo "========================================"

          while IFS= read -r apk; do
            if [ -f "$apk" ]; then
              echo ""
              echo "APK: $apk"
              ls -lh "$apk"
            fi
          done < "$GITHUB_WORKSPACE/apk-list.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutbolHub-Planifica-APK
          path: |
            ${{ github.workspace }}/**/*.apk
          if-no-files-found: error
          retention-days: 30
