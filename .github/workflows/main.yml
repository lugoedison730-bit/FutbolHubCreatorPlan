name: Construir APK FútbolHub + Planifica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto
        shell: bash
        run: |
          set -e

          rm -rf proyecto
          mkdir -p proyecto

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d proyecto

          echo "Contenido inicial:"
          find proyecto -maxdepth 4 -type f | sort

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Buscar proyecto Android
        shell: bash
        run: |
          set -e

          echo "=== Buscando proyecto Android ==="

          SETTINGS_FILE=$(find proyecto \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts."

            echo "Contenido del directorio proyecto:"
            find proyecto -maxdepth 5 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Archivo de configuración encontrado:"
          echo "$SETTINGS_FILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto Android:"
          echo "$PROJECT_DIR"

      - name: Revisar configuración Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Proyecto ==="
          pwd

          echo
          echo "=== Archivos Gradle ==="
          find . -maxdepth 4 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print | sort

          echo
          echo "=== Versión de Java ==="
          java -version

          echo
          echo "=== Versión de Gradle ==="
          gradle --version

      - name: Construir APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Construyendo APK Debug ==="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Buscar APK
        shell: bash
        run: |
          set -e

          echo "=== Buscando APK generado ==="

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No se encontró ningún APK."

            echo
            echo "Archivos generados:"
            find "$PROJECT_DIR" -type f | sort

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: futbolhub-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
